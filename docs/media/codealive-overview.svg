<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title description">
  <title id="title">CodeAlive: understand, replay, review and explain</title>
  <desc id="description">Follow JavaScript and TypeScript source links, replay the discount example with inputs 100 and 20 for result 80 or 200 and 50 for result 100, compare changes and existing GitHub checks, and create editable narrated explanation videos in the 1.0 candidate.</desc>
  <style>
    text{font-family:DejaVu Sans,sans-serif}
    .label{font-size:17px;font-weight:700;letter-spacing:2px;fill:#a4edcf}
    .title{font-size:28px;font-weight:700;fill:#e8eef5}
    .body{font-size:20px;fill:#c2d1e0}
    .note{font-size:18px;fill:#9eafc3}
    .card{fill:#111a26;stroke:#29374a;stroke-width:1.5}
  </style>
  <rect width="1100" height="600" rx="18" fill="#0b1018"/>
  <text x="40" y="48" class="label">CODEALIVE</text>
  <text x="40" y="105" font-size="40" font-weight="700" fill="#e8eef5">Read code. Explore inputs. Explain changes.</text>
  <text x="40" y="141" class="body">Source links · captured values · existing evidence · visual explanations</text>

  <rect x="40" y="174" width="500" height="170" rx="12" class="card"/>
  <text x="66" y="205" class="label">01 / EXPLAIN</text>
  <text x="66" y="245" class="title">Find the relevant logic</text>
  <text x="66" y="280" class="body">Inputs · branches · return paths</text>
  <text x="66" y="317" class="note">Click a step → jump to its source</text>

  <rect x="560" y="174" width="500" height="170" rx="12" class="card"/>
  <text x="586" y="205" class="label">02 / REPLAY</text>
  <text x="586" y="245" class="title">Try concrete inputs</text>
  <rect x="586" y="263" width="214" height="43" rx="7" fill="#173139"/>
  <rect x="812" y="263" width="222" height="43" rx="7" fill="#173139"/>
  <text x="693" y="292" text-anchor="middle" font-size="23" fill="#a4edcf">[100,20] → 80</text>
  <text x="923" y="292" text-anchor="middle" font-size="23" fill="#a4edcf">[200,50] → 100</text>
  <text x="586" y="330" class="note">Step through a captured run</text>

  <rect x="40" y="364" width="500" height="170" rx="12" class="card"/>
  <text x="66" y="395" class="label">03 / REVIEW</text>
  <text x="66" y="435" class="title">See what changed</text>
  <text x="66" y="471" class="body">Before/after source · PR checks in VS Code</text>
  <text x="66" y="508" class="note">Existing evidence, with gaps visible</text>

  <rect x="560" y="364" width="500" height="170" rx="12" class="card"/>
  <text x="586" y="395" class="label">04 / SHARE</text>
  <rect x="849" y="378" width="185" height="29" rx="7" fill="#30304d"/>
  <text x="941" y="398" text-anchor="middle" font-size="15" font-weight="700" fill="#d8c9ff">1.0 CANDIDATE</text>
  <text x="586" y="435" class="title">Teach it visually</text>
  <text x="586" y="471" class="body">Editable scenes + your narration</text>
  <text x="586" y="508" class="note">Optional music · local video export</text>

  <text x="40" y="574" font-size="17" fill="#9eafc3">VS Code + offline browser · JavaScript / TypeScript</text>
  <text x="1060" y="574" text-anchor="end" font-size="15" fill="#73869e">Feature overview</text>
</svg>

name: Published desktop acceptance
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/desktop-acceptance.yml
      - tests/vscode/**
  pull_request:
    paths:
      - .github/workflows/desktop-acceptance.yml
      - tests/vscode/**
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published beta tag to install
        required: true
        default: v1.0.2
        type: string
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - run: npm ci --ignore-scripts
      - name: Install media tools on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ffmpeg -version
          ffprobe -version
      - name: Install media tools on macOS
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          if ! command -v ffmpeg >/dev/null; then
            brew install ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Download and verify the published VSIX
        run: node tests/vscode/published.cjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEALIVE_ACCEPTANCE_TAG: ${{ inputs.release_tag || 'v1.0.2' }}
      - name: Test fresh installation and legacy upgrade
        run: npm run test:vscode
        env:
          CODEALIVE_ACCEPTANCE_PR: ${{ github.event.pull_request.html_url }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: desktop-acceptance-${{ matrix.os }}
          path: test-results/vscode-acceptance/
          if-no-files-found: ignore
